<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>딜온도 — 해외직구 핫딜 딜보드</title>
<meta name="description" content="아마존·이베이·Woot·노드스트롬랙 등 미국 직구 핫딜을 하루 종일 자동 수집해, 관부가세·배송비 포함 원화 실질가와 할인 점수로 골라 보여드립니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="딜온도">
<meta property="og:title" content="딜온도 — 해외직구 핫딜 딜보드">
<meta property="og:description" content="미국 직구 핫딜을 관부가세 포함 원화가·할인 점수로 골라 보는 딜보드">
<meta property="og:locale" content="ko_KR">
<style>
  /* ── 애플 디자인 시스템: 다크 기본 + OS 라이트모드 자동 대응 ── */
  :root{
    --bg:#000000; --bg2:#0a0a0c; --card:#1c1c1e; --card-h:#2c2c2e;
    --line:rgba(255,255,255,.09); --line-s:rgba(255,255,255,.16);
    --txt:#f5f5f7; --sub:#86868b; --sub2:#a1a1a6;
    --accent:#2997ff; --accent-h:#0a84ff;
    --deal:#ff9f0a; --deal-soft:rgba(255,159,10,.14);
    --flash:#ff453a; --hot:#ff9f0a; --steady:#ffd60a;
    --track:rgba(255,255,255,.06); --track-h:rgba(255,255,255,.12);
    --glass:rgba(10,10,12,.72);
    --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.28);
    --shadow-h:0 4px 12px rgba(0,0,0,.55),0 18px 48px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f5f7; --bg2:#ffffff; --card:#ffffff; --card-h:#ffffff;
      --line:rgba(0,0,0,.08); --line-s:rgba(0,0,0,.14);
      --txt:#1d1d1f; --sub:#6e6e73; --sub2:#515154;
      --accent:#0071e3; --accent-h:#0077ed;
      --deal:#bf5a00; --deal-soft:rgba(191,90,0,.10);
      --flash:#d70015; --hot:#bf5a00; --steady:#9a7500;
      --track:rgba(0,0,0,.05); --track-h:rgba(0,0,0,.09);
      --glass:rgba(245,245,247,.72);
      --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
      --shadow-h:0 4px 10px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.12);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Segoe UI","Noto Sans KR",sans-serif;
    letter-spacing:-.01em;line-height:1.5}

  /* ── 프로스티드 글래스 헤더 ── */
  header{position:sticky;top:0;z-index:20;
    background:var(--glass);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brandmark{display:flex;align-items:center;gap:9px}
  .dot{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ffd60a,var(--deal));
    box-shadow:0 0 12px var(--deal-soft)}
  h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.03em}
  .meta{color:var(--sub);font-size:13px;font-weight:400}
  .spacer{flex:1 1 auto}

  /* ── 애플식 필 컨트롤 ── */
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .toolbar .lbl{font-size:12px;color:var(--sub);margin-right:2px;font-weight:500}
  .toolbar button{background:var(--track);color:var(--sub2);border:none;
    padding:8px 14px;border-radius:980px;cursor:pointer;font-size:13px;font-weight:500;
    letter-spacing:-.01em;transition:background .18s,color .18s,transform .12s;
    font-family:inherit;white-space:nowrap}
  .toolbar button:hover{background:var(--track-h);color:var(--txt)}
  .toolbar button:active{transform:scale(.96)}
  .toolbar button.active{background:var(--accent);color:#fff;font-weight:600}

  /* ── 제휴 고지 ── */
  .disclose{padding:10px 28px 0;font-size:11px;color:var(--sub);
    max-width:1440px;margin:0 auto;line-height:1.5}

  /* ── 카드 그리드 ── */
  main{padding:22px 28px 60px;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    align-items:start;
    max-width:1440px;margin:0 auto}
  .card{background:var(--card);border:.5px solid var(--line);border-radius:18px;
    padding:20px;display:flex;flex-direction:column;gap:11px;
    box-shadow:var(--shadow);
    transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s,border-color .28s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:var(--line-s)}
  .row{display:flex;align-items:center;gap:9px}

  /* 상태 배지: 은은한 틴트 + 컬러 텍스트 */
  .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:980px;
    letter-spacing:-.01em}
  .FLASH{background:rgba(255,69,58,.16);color:var(--flash)}
  .HOT{background:rgba(255,159,10,.16);color:var(--hot)}
  .STEADY{background:rgba(255,214,10,.16);color:var(--steady)}
  .score{margin-left:auto;font-size:12px;color:var(--sub)}
  .score b{color:var(--txt);font-size:15px;font-weight:600}

  .brandrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
  .brand{font-size:15px;color:var(--txt);font-weight:700;letter-spacing:-.02em}
  .btier{font-size:10px;font-weight:600;padding:2px 8px;border-radius:980px;letter-spacing:-.01em}
  .btier.premium{background:linear-gradient(135deg,#caa24a,#ffe08a);color:#3a2a00}
  .btier.known{background:rgba(41,151,255,.16);color:var(--accent)}
  .btier.unknown{background:var(--track);color:var(--sub)}

  .title{font-size:15px;font-weight:500;line-height:1.4;color:var(--txt);letter-spacing:-.01em}

  .price{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:1px}
  .now{font-size:23px;font-weight:700;letter-spacing:-.03em}
  .was{color:var(--sub);text-decoration:line-through;font-size:13px}
  .off{color:var(--deal);font-weight:600;font-size:12px;
    background:var(--deal-soft);padding:3px 9px;border-radius:980px}

  /* 코드딜 강조: 절제된 오렌지 링 */
  .promo{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;
    background:var(--deal-soft);color:var(--deal);border-radius:12px;padding:8px 12px;line-height:1.4}
  .promo code{font-family:"SF Mono",ui-monospace,Menlo,monospace;
    background:rgba(255,159,10,.18);color:var(--deal);
    padding:2px 7px;border-radius:6px;letter-spacing:.3px;font-weight:600}
  .card.codedeal{border-color:rgba(255,159,10,.5)}
  .card.codedeal:hover{border-color:var(--deal)}

  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--sub);background:var(--track);
    padding:3px 9px;border-radius:980px}

  .foot{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
  .src{font-size:11px;color:var(--sub)}
  a.go{margin-left:auto;background:var(--accent);color:#fff;text-decoration:none;
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:980px;
    letter-spacing:-.01em;transition:background .18s,transform .12s}
  a.go:hover{background:var(--accent-h)}
  a.go:active{transform:scale(.96)}

  .bd{font-size:10.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;
    border-top:.5px solid var(--line);padding-top:9px;margin-top:1px;opacity:.75}

  /* 썸네일: 이미지가 깨지면 숨기고 카드 레이아웃은 유지 */
  .thumb{width:100%;height:180px;object-fit:contain;border-radius:12px;
    background:#fff;display:block}
  .krw{font-size:13px;color:var(--sub2);margin-top:-4px}
  .krw b{color:var(--txt);font-weight:600}
  .fresh.stale{color:var(--deal)}
  .card.stale .price .now{opacity:.55}

  .empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:80px 20px;font-size:15px}

  @media (max-width:640px){
    header{padding:14px 18px;gap:12px}
    main{padding:18px 18px 48px;gap:14px;grid-template-columns:1fr}
    .disclose{padding:10px 18px 0}
  }
</style>
</head>
<body>
<header>
  <div class="brandmark">
    <span class="dot"></span>
    <h1>딜온도</h1>
  </div>
  <span class="meta" id="meta">불러오는 중…</span>
  <span class="spacer"></span>
  <div class="toolbar" id="cats">
    <button data-c="ALL" class="active">전체</button>
    <button data-c="kids">육아·키즈</button>
    <button data-c="fashion">의류·잡화</button>
    <button data-c="shoes">신발</button>
    <button data-c="elec">전자·IT</button>
    <button data-c="sports">스포츠·아웃도어</button>
    <button data-c="home">홈·주방</button>
  </div>
  <div class="toolbar" id="filters">
    <button data-f="ALL" class="active">전체</button>
    <button data-f="FLASH">FLASH</button>
    <button data-f="HOT">HOT</button>
    <button data-f="STEADY">STEADY</button>
    <button data-f="PREMIUM">프리미엄</button>
  </div>
  <div class="toolbar" id="sorts">
    <span class="lbl">정렬</span>
    <button data-s="score" class="active">점수순</button>
    <button data-s="recent">최신순</button>
  </div>
</header>
<div class="disclose">
  일부 링크는 제휴 링크로, 회원님의 구매 시 딜온도가 소정의 수수료를 받을 수 있습니다(구매가는 동일).
  표시 가격은 마지막 확인 시점 기준이며 실시간으로 바뀔 수 있습니다. 원화 금액은 배송비·관부가세를 포함한 추정치이니 결제 전 판매처에서 최종 가격을 확인하세요.
</div>
<main id="board"><div class="empty">deals.json 로딩 중…</div></main>

<script>
const board=document.getElementById('board');
const meta=document.getElementById('meta');
let deals=[], filter='ALL', cat='ALL', sort='score';

// 스크랩한 제목·브랜드는 외부 텍스트다. innerHTML에 그대로 넣으면
// '<img onerror=...>' 같은 문자열이 스크립트로 실행될 수 있어 반드시 이스케이프한다.
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
// 링크는 http(s)만 허용 — javascript: 등 다른 스킴은 차단
function safeUrl(u){u=String(u||'');return /^https?:\/\//i.test(u)?u:'';}
// 이미지: '//host/..' 상대주소 보정, 'null'이 섞인 깨진 주소는 버림(실측: '//www.6pm.comnull')
function imgUrl(u){u=String(u||'').trim();if(!u||/null$|undefined$/i.test(u))return '';
  if(u.startsWith('//'))u='https:'+u;return safeUrl(u);}
function fmtKRW(v){return v==null?'':'₩'+Math.round(v).toLocaleString('ko-KR');}
// 마지막으로 가격을 확인한 지 이 시간이 지나면 '가격 변동 가능'으로 표시
const STALE_HOURS=24;
function fmtPrice(v){if(v==null)return '—';const n=Number(v);const f=Number.isInteger(n)?0:2;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:f,maximumFractionDigits:2});}
function timeAgo(iso){
  const t=Date.parse(iso||0); if(!t)return '';
  const m=Math.max(0,Math.floor((Date.now()-t)/60000));
  if(m<1)return '방금'; if(m<60)return m+'분 전';
  const h=Math.floor(m/60); if(h<24)return h+'시간 전';
  return Math.floor(h/24)+'일 전';
}

// 딜을 해외직구 분류(육아·키즈 / 의류·잡화 / 신발 / 전자·IT / 스포츠·아웃도어)로 매핑.
// 신발은 제목 키워드로 감지해 카테고리보다 우선(운동화 포함 신발은 신발 탭으로).
const SHOE_RE=/\b(shoe|sneaker|trainer|boot|bootie|loafer|heel|sandal|slipper|pump|flat|mule|clog|oxford|moccasin|espadrille|wedge|slide|footwear|cleat)\b/i;
const HOME_RE=/\b(kitchen|cookware|dinnerware|bakeware|cutlery|knife|knives|pan|pot|skillet|blender|mixer|toaster|kettle|coffee maker|air fryer|vacuum|cookset|bedding|sheet set|comforter|duvet|towel|pillow|mattress|furniture|sofa|couch|chair|desk|dresser|shelf|cabinet|decor|rug|lamp|storage)\b/i;
const CAT_LABEL={kids:'육아·키즈',fashion:'의류·잡화',shoes:'신발',elec:'전자·IT',sports:'스포츠·아웃도어',home:'홈·주방',etc:'기타'};
function dispCat(d){
  const c=d.category||'', t=d.title||'';
  if(c==='kids') return 'kids';
  if(c==='electronics') return 'elec';
  if(SHOE_RE.test(t)) return 'shoes';
  if(c==='sports_outdoor') return 'sports';
  if(c==='premium_fashion'||c==='watch_misc') return 'fashion';
  if(c==='home'||HOME_RE.test(t)) return 'home';
  return 'etc';
}

function render(){
  const list=deals.filter(d=>
    (filter==='ALL'||(filter==='PREMIUM'?d.brand_tier==='premium':d.urgency===filter))
    && (cat==='ALL'||dispCat(d)===cat));
  // 정렬: 점수순(기본) 또는 최신순(등록시각 detected_at 내림차순)
  if(sort==='recent'){
    list.sort((a,b)=>(Date.parse(b.detected_at||0)||0)-(Date.parse(a.detected_at||0)||0));
  }else{
    list.sort((a,b)=>(b.score||0)-(a.score||0));
  }
  if(!list.length){board.innerHTML='<div class="empty">표시할 딜이 없습니다.</div>';return;}
  board.innerHTML=list.map(d=>{
    const tags=[];
    if(d.coupon_stackable)tags.push('🎟️ 쿠폰중복');
    if(d.off_season)tags.push('❄️ 역시즌');
    if(d.free_gift)tags.push('🎁 사은품');
    if(d.price_alltime_low!=null && d.price_current!=null && d.price_current<=d.price_alltime_low)tags.push('📉 역대최저');
    const b=d.score_breakdown||{};
    const href=safeUrl(d.buy_url)||safeUrl(d.url);
    const img=imgUrl(d.image);
    const seenH=d.last_seen?(Date.now()-Date.parse(d.last_seen))/3600000:null;
    const stale=seenH!=null&&seenH>STALE_HOURS;
    return `<div class="card${d.coupon_code?' codedeal':''}${stale?' stale':''}">
      ${img?`<img class="thumb" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
      <div class="row">
        <span class="badge ${esc(d.urgency)}">${d.coupon_code?'🔥 코드딜':esc(d.urgency)}</span>
        <span class="src">${esc(d.source)} · ${esc(d.source_tier)}</span>
        <span class="score">점수 <b>${esc(d.score)}</b>/100</span>
      </div>
      ${d.brand?`<div class="brandrow">
        <span class="brand">${esc(d.brand)}</span>
        ${d.brand_tier?`<span class="btier ${d.brand_tier}">${({premium:'⭐ 프리미엄',known:'✓ 유명',unknown:'· 무명'})[d.brand_tier]||''}</span>`:''}
      </div>`:''}
      <div class="title"${d.brand?'':' style="font-size:16px;font-weight:700"'}>${esc(d.title)}</div>
      <div class="price">
        <span class="now">${fmtPrice(d.price_current)}</span>
        ${d.price_list?`<span class="was">${fmtPrice(d.price_list)}</span>`:''}
        ${d.discount_pct?`<span class="off">${esc(d.discount_pct)}% OFF</span>`:''}
      </div>
      ${d.krw_effective?`<div class="krw">≈ <b>${fmtKRW(d.krw_effective)}</b> · 배송비·관부가세 포함 추정</div>`:''}
      ${d.coupon_code?`<div class="promo">🔥 결제창 코드 <code>${esc(d.coupon_code)}</code> 입력 시 ${fmtPrice(d.price_current)}</div>`:''}
      ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      <div class="foot">
        <span class="src">${CAT_LABEL[dispCat(d)]||''}</span>
        ${d.detected_at?`<span class="src">🕒 ${timeAgo(d.detected_at)} 발견</span>`:''}
        ${d.last_seen?`<span class="src fresh${stale?' stale':''}">${stale?'⚠️ ':'🔄 '}${timeAgo(d.last_seen)} 확인${stale?' · 가격 변동 가능':''}</span>`:''}
        ${href?`<a class="go" href="${esc(href)}" target="_blank" rel="noopener noreferrer sponsored">딜 보기 →</a>`:''}
      </div>
      <div class="bd">
        <span>할인 ${esc(b.discount_depth??0)}</span><span>이력 ${esc(b.price_history??0)}</span>
        <span>카테고리 ${esc(b.category??0)}</span><span>브랜드 ${esc(b.brand??0)}</span><span>보너스 ${esc(b.bonus??0)}</span>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('filters').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');filter=e.target.dataset.f;render();
});
document.getElementById('cats').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#cats button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');cat=e.target.dataset.c;render();
});
document.getElementById('sorts').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#sorts button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');sort=e.target.dataset.s;render();
});

fetch('deals.json').then(r=>r.json()).then(data=>{
  deals=data.deals||[];
  const t=new Date(data.generated_at);
  // 분류별 개수를 탭 라벨 옆에 표시
  const counts={};deals.forEach(d=>{const c=dispCat(d);counts[c]=(counts[c]||0)+1;});
  document.querySelectorAll('#cats button').forEach(b=>{
    const c=b.dataset.c; if(c==='ALL'){b.textContent='전체 '+deals.length;return;}
    const base=b.textContent.replace(/\s+\d+$/,''); b.textContent=base+' '+(counts[c]||0);
  });
  meta.textContent=`발행 ${data.count}건 · 갱신 ${t.toLocaleString('ko-KR')}`;
  render();
}).catch(e=>{
  board.innerHTML='<div class="empty">deals.json을 불러오지 못했습니다.<br>먼저 <code>python run.py --sample</code>를 실행하세요.<br><small>'+e+'</small></div>';
});
</script>
</body>
</html>
