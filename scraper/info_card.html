<!doctype html><html><head><meta charset="utf-8"><style>
/* 정보 글 카드 (1080×1350) — 08_pcode.png 와 같은 어두운 스타일. info_posts.render_card 가 {{…}} 를 채운다 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#1C1F2B;color:#F4F1EC;font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;padding:96px 84px 64px;display:flex;flex-direction:column}
.k{font-size:32px;font-weight:700;letter-spacing:.03em;color:#F28C28}
h1{font-size:{{HSIZE}}px;font-weight:900;line-height:1.16;letter-spacing:-.035em;margin-top:44px;word-break:keep-all}
h1 em{font-style:normal;background:linear-gradient(90deg,#F28C28,#F5C542);-webkit-background-clip:text;color:transparent}
.sub{font-size:32px;color:#A7ABB8;margin-top:28px;line-height:1.45;word-break:keep-all}
.sub:empty{display:none}
.rows{margin-top:auto;border-top:2px solid #333849}
.row{display:flex;gap:44px;padding:{{RPAD}}px 0;border-bottom:2px solid #333849;align-items:flex-start}
.row .n{font-size:40px;font-weight:900;color:#F28C28;min-width:34px;line-height:1.25}
.row .t{font-size:{{TSIZE}}px;font-weight:500;line-height:1.3;word-break:keep-all}
.row .s{font-size:{{SSIZE}}px;color:#A7ABB8;margin-top:8px;line-height:1.4;word-break:keep-all}
.row .s:empty{display:none}
.note{font-size:24px;color:#80869A;margin-top:22px;line-height:1.5;word-break:keep-all}
.note:empty{display:none}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;font-size:34px;font-weight:900}
.foot small{font-size:30px;font-weight:500;color:#8A8F9E}
</style></head><body>
<div class="k">{{KICKER}}</div>
<h1>{{HEAD}}</h1>
<div class="sub">{{SUB}}</div>
<div class="rows">{{ROWS}}</div>
<div class="note">{{NOTE}}</div>
<div class="foot"><div>딜온도 D°</div><small>@deal_ondo</small></div>
</body></html>
