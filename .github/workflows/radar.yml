name: Dealondo Radar

# PC를 켜두지 않아도 GitHub 서버가 스크래퍼를 돌린다.
# 결과(deals.json)를 리포에 커밋 → GitHub Pages 딜보드가 갱신되고, 텔레그램 알림도 서버에서 발송된다.
#
# 실행 시각(중요)
#  · 주 트리거: 외부 알람(cron-job.org)이 10분마다 workflow_dispatch 로 깨운다.
#    GitHub 자체 예약(schedule)은 수십 분~수 시간씩 밀리거나 빠지는 일이 잦아서(10/16~18 실측)
#    정시성을 외부 알람에 맡긴다. 수동 실행(workflow_dispatch)은 밀리지 않고 바로 시작된다.
#  · 보조 트리거: 아래 schedule 은 외부 알람이 끊겼을 때를 위한 안전망.
on:
  schedule:
    - cron: '7,27,47 * * * *'   # 안전망(정각을 피한 분) — 밀려도 외부 알람이 주 트리거
  workflow_dispatch: {}

# 이전 실행이 안 끝났으면 겹치지 않게 한 번에 하나만(대기 1개까지).
concurrency:
  group: dealondo-radar
  cancel-in-progress: false

permissions:
  contents: write              # deals.json 커밋/푸시 권한

env:
  # DB는 리포 안 data/ 에 두고 캐시로 유지
  RADAR_DB: ${{ github.workspace }}/data/radar.db
  # 딜보드 JSON은 리포 루트로 → GitHub Pages가 서빙
  RADAR_WEB_JSON: ${{ github.workspace }}/deals.json
  RADAR_MIN_FREE_MB: '500'
  RADAR_DISABLE_RENDER: '1'        # CI는 정적 수집만 (렌더 사이트는 로컬에서)
  RADAR_T1_MINUTES: '8'            # 빠른 소스(T1)는 매 실행마다
  RADAR_FETCH_BUDGET_SEC: '150'
  RADAR_SITE_BUDGET_SEC: '20'
  RADAR_DOA_ENRICH_BUDGET_SEC: '70'
  PYTHONUTF8: '1'
  # 시크릿 (Settings > Secrets and variables > Actions)
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  RADAR_IMAP_USER: ${{ secrets.RADAR_IMAP_USER }}
  RADAR_IMAP_PASS: ${{ secrets.RADAR_IMAP_PASS }}
  # 아래는 선택 — 등록한 것만 켜지고, 비어 있으면 코드가 조용히 건너뛴다.
  WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
  TELEGRAM_FREE_CHAT_ID: ${{ secrets.TELEGRAM_FREE_CHAT_ID }}
  RADAR_AMAZON_TAG: ${{ secrets.RADAR_AMAZON_TAG }}
  RADAR_SKIMLINKS_ID: ${{ secrets.RADAR_SKIMLINKS_ID }}
  RADAR_SOVRN_KEY: ${{ secrets.RADAR_SOVRN_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # DB(가격이력·중복방지)를 실행 간에 유지한다(리포 대신 Actions 캐시).
      - name: DB 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db
          key: dealondo-db-${{ github.run_id }}
          restore-keys: |
            dealondo-db-

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ① 빠른 수집: 슬릭딜 RSS·슬릭딜 알림 메일·Woot API·T1 워치리스트.
      #    시간 민감한 딜이라 먼저 돌리고 곧바로 딜보드에 반영한다(느린 수집을 기다리지 않음).
      - name: 빠른 수집 (T1)
        env:
          RADAR_RUN_BUDGET_SEC: '240'
        run: |
          mkdir -p data
          cd scraper
          timeout --preserve-status 300 python scheduler.py --once --tier T1 --due-only || echo "[CI] T1 시간 상한 — 부분 결과로 진행"

      - name: 딜보드 반영 (빠른 수집분)
        run: |
          cp -f web/index.html index.html || true
          bash .github/scripts/push_files.sh "딜보드 갱신(빠른) $(date -u +%Y-%m-%dT%H:%M:%SZ)" deals.json index.html

      # ② 느린 수집: DoA·DealNews·TechBargains·제휴피드(T2), 리테일러(T3), 뉴스레터(T4) — 주기가 된 것만.
      - name: 나머지 수집 (T2~T4, 주기 된 것만)
        env:
          RADAR_RUN_BUDGET_SEC: '660'
        run: |
          cd scraper
          timeout --preserve-status 720 python scheduler.py --once --tier T2,T3,T4 --due-only || echo "[CI] 시간 상한 — 부분 결과로 진행"

      - name: DB 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/radar.db
          key: dealondo-db-${{ github.run_id }}

      - name: 딜보드 반영 (전체)
        if: always()
        run: |
          cp -f web/index.html index.html || true
          bash .github/scripts/push_files.sh "딜보드 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)" deals.json index.html
